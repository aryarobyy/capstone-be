name: Database Migration

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Migration action to execute on server'
        required: true
        default: 'up'
        type: choice
        options:
          - up
          - down
          - status

jobs:
  migrate:
    name: Run Migration on Server
    runs-on: ubuntu-latest
    steps:
      - name: Execute migration via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.SSH_PORT || 22 }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/${{ secrets.USERNAME }}/app/capstone-be
            chmod +x migrate
            ./migrate ${{ github.event.inputs.action }}
